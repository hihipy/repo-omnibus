name: Go

on:
  # Run on pushes to main that touch the code or the module
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - ".github/workflows/go.yml"

  # Run on pull requests that touch the code or the module
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - ".github/workflows/go.yml"

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  test:
    # The tool reads a real terminal and a real cache directory, so it is worth
    # knowing it builds and passes on the platforms people run it from.
    strategy:
      # One broken combination should not cancel the jobs that would have told
      # us something.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.22 is the floor go.mod declares; stable is what people run.
        go: ["1.22", "stable"]
        exclude:
          # Go 1.22's linker writes Mach-O binaries with no LC_UUID load
          # command, and the current macOS runner's dyld refuses to load one
          # under -race. The floor is still checked on Linux, and macOS is
          # still checked on the toolchain people actually have.
          - os: macos-latest
            go: "1.22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/repo-omnibus
